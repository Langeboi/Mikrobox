<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mikrobox</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/vendor/xterm.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header id="top">
  <div class="brand">
    <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="var(--accent)"/><path d="M6 16V8l6 5 6-5v8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Mikrobox</span>
  </div>
  <label class="sr" for="lab-select">Lab</label>
  <select id="lab-select"></select>
  <div class="menu">
    <button type="button" class="menu-btn" aria-haspopup="true">Lab</button>
    <div class="menu-list" hidden>
      <button type="button" data-act="lab-new">New lab</button>
      <button type="button" data-act="lab-rename" data-needs-lab>Rename lab</button>
      <hr>
      <button type="button" data-act="lab-import">Import lab from file</button>
      <button type="button" data-act="lab-export" data-needs-lab>Export lab to file</button>
      <hr>
      <button type="button" data-act="lab-delete" data-needs-lab class="danger">Delete lab</button>
    </div>
  </div>
  <div class="menu">
    <button type="button" class="menu-btn" aria-haspopup="true">Configs</button>
    <div class="menu-list" hidden>
      <button type="button" data-act="cfg-export" data-needs-lab>Export selected router's config</button>
      <button type="button" data-act="cfg-export-all" data-needs-lab>Export all router configs (zip)</button>
      <hr>
      <button type="button" data-act="cfg-import" data-needs-lab>Import config into selected router</button>
      <button type="button" data-act="cfg-identity" data-needs-lab>Push hostname to selected router</button>
      <hr>
      <button type="button" data-act="bak-settings" data-needs-lab>Automatic backups</button>
      <button type="button" data-act="bak-run" data-needs-lab>Back up all routers now</button>
      <button type="button" data-act="bak-compare" data-needs-lab>Compare revisions</button>
    </div>
  </div>
  <button type="button" id="templates" class="plain-btn">Templates</button>
  <div class="menu">
    <button type="button" class="menu-btn" aria-haspopup="true">Tools</button>
    <div class="menu-list" hidden>
      <button type="button" data-act="tool-packets" data-needs-lab>Packet view</button>
      <button type="button" data-act="tool-test" data-needs-lab>Connectivity test</button>
      <hr>
      <button type="button" data-act="tool-docs" data-needs-lab>Export documentation</button>
      <button type="button" data-act="tool-png" data-needs-lab>Export topology as PNG</button>
    </div>
  </div>
  <span class="spacer"></span>
  <span id="who" aria-label="Other people in this lab"></span>
  <span id="sys" class="chip"></span>
  <button id="lab-stop" type="button">Stop all</button>
  <button id="lab-start" type="button" class="primary">Start all</button>
  <button id="settings" type="button" class="icon-btn" aria-label="Settings" title="Settings"></button>
  <div class="menu right" id="account" hidden>
    <button type="button" class="menu-btn" aria-haspopup="true" id="account-btn">Account</button>
    <div class="menu-list" hidden>
      <button type="button" data-act="acct-users">Accounts</button>
      <button type="button" data-act="acct-password">Change my password</button>
      <hr>
      <button type="button" data-act="acct-logout">Sign out</button>
    </div>
  </div>
</header>
<div id="banner" hidden></div>
<main>
  <div id="stage">
    <svg id="canvas" role="img" aria-label="Lab topology"><g id="world"></g></svg>
    <div id="empty" hidden></div>
    <nav id="tools" aria-label="Tools"></nav>
    <div id="hint" role="status"></div>
    <div id="zoom" aria-label="Zoom">
      <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
      <button type="button" id="zoom-reset" title="Reset zoom">100%</button>
      <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
      <button type="button" id="zoom-fit">Fit</button>
    </div>
    <aside id="inspector" aria-label="Details" hidden></aside>
  </div>
  <section id="dock" hidden aria-label="Consoles">
    <div id="tabs"></div>
    <div id="terms"></div>
  </section>
</main>
<div id="modal" hidden>
  <form id="modal-box">
    <h2 id="modal-title"></h2>
    <div id="modal-fields"></div>
    <p id="modal-error" role="alert"></p>
    <div class="row end">
      <button type="button" id="modal-cancel">Cancel</button>
      <button type="submit" class="primary" id="modal-ok">OK</button>
    </div>
  </form>
</div>
<div id="toast" role="status" hidden></div>
<script src="/static/vendor/xterm.js"></script>
<script src="/static/vendor/xterm-addon-fit.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
