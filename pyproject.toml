[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mikrobox"
version = "0.1.0"
description = "A browser-driven lab for MikroTik CHR routers"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "paramiko>=3.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
mikrobox = "mikrobox.__main__:main"

[tool.setuptools]
packages = ["mikrobox"]

[tool.setuptools.package-data]
mikrobox = ["static/*", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
